<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <title>Sign Up</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="javascripts/signup.js"  defer></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=lock_person" />
</head>
<body>
    <div class="wrapper">
        <h1>Sign Up</h1>
        <p id="error-message"></p>
        <form id="form">
            <div>
                <input required type="text" name="firstname" id="firstname-input" placeholder="Full Name">
            </div>
            <div>
                <input required type="text" name="studentNumber" id="studentNumber" placeholder="Student Number">
            </div>
            <div>
                <input required type="text" name="campus" id="campus" placeholder="Campus">
            </div>
            <div>
                <label for="email-input">
                    <span>@</span>
                </label>
                <input required type="email" name="email" id="email-input" placeholder="Email">
            </div>
            <div>
                <input required type="text" name="interests" id="interests" placeholder="Interests (separated with commas)">
            </div>
            <div>
                <label for="password-input"><span class="material-symbols-outlined">
lock_person
</span></label>
                <input required type="password" name="password" id="password-input" placeholder="Password">
            </div>
            <div>
                <label for="repeat_password"><span class="material-symbols-outlined">
lock_person
</span></label>
                <input required type="password" name="repeat_password" id="repeat_password" placeholder="Verify Your Password">
            </div>
            <div>
                <textarea name="bio" id="bio" placeholder="Short bio"></textarea>
            </div>
                <p id="error-message"></p>
                <a href="/html-scripts/profile.html">
                <button type="submit">Sign Up</button>
            </a>
        </form>
        <aside id="asidePreview">
        <div id="profilePreview">
            <h2 id="previewName">Your Name</h2>
            <p id="previewBio">Your bio will appear here...</p>
            <div id="previewInterests"></div>
        </div>
        </aside>
        <p>Do you already have an Account? Log in here.</p>
    </div>
</body>
</html>
